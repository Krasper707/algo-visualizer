<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Sorting Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Advanced Sorting Visualizer</h1>
        
        <div class="control-panel">
            <div class="input-section">
                <input type="text" id="customInput" placeholder="e.g. 10, 50, 20, 80, 30">
                <button onclick="loadCustomArray()">Load Data</button>
                <button onclick="generateRandomArray(40)">Random (40)</button>
                <button onclick="generateRandomArray(150)">Massive (150)</button>
            </div>
            
            <div class="algo-section">
                <select id="algo" onchange="updateAlgoInfo()">
                    <option value="bubble">Bubble Sort</option>
                    <option value="selection">Selection Sort</option>
                    <option value="insertion">Insertion Sort</option>
                    <option value="merge">Merge Sort</option>
                    <option value="quick">Quick Sort</option>
                    <option value="heap">Heap Sort</option>
                    <option value="shell">Shell Sort</option>
                    <option value="cocktail">Cocktail Sort</option>
                </select>
                <label>Speed: <input type="range" id="speed" min="1" max="200" value="150"></label>
                <button id="generateBtn" class="primary-btn" onclick="initSort()">Prepare Algorithm</button>
            </div>

            <div class="playback-section">
                <button id="resetBtn" onclick="resetPlayback()" disabled>Reset</button>
                <button id="prevBtn" onclick="stepBack()" disabled>Back</button>
                <button id="playBtn" onclick="togglePlay()" class="play-btn" disabled> Play</button>
                <button id="nextBtn" onclick="stepForward()" disabled>Next</button>
            </div>
        </div>

        <div class="info-panel">
            <div class="stats">
                <span>Comparisons: <strong id="compCount">0</strong></span>
                <span>Swaps/Writes: <strong id="swapCount">0</strong></span>
            </div>
            <div class="complexity">
                <span id="timeComplexity">Time: O(n²)</span>
                <span id="spaceComplexity">Space: O(1)</span>
            </div>
        </div>
    </div>

    <div id="container"></div>

    <script src="script.js"></script>
</body>
</html>
